<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:'Space Grotesk';font-weight:500;src:url('fonts/space-grotesk-latin-500-normal.woff2')}
@font-face{font-family:'Space Grotesk';font-weight:700;src:url('fonts/space-grotesk-latin-700-normal.woff2')}
@font-face{font-family:'Bebas Neue';src:url('fonts/bebas-neue-latin-400-normal.woff2')}
html,body{margin:0;background:#000}
.c{position:relative;width:1360px;height:2048px;overflow:hidden;background:#000}
.c img.bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.c img.logo{position:absolute;left:150px;top:150px;width:1060px}
.sub{position:absolute;left:0;right:0;top:480px;text-align:center;font:700 52px 'Space Grotesk';letter-spacing:18px;color:#FFB000;text-shadow:0 2px 18px #000}
.aut{position:absolute;left:90px;bottom:80px;font:500 34px 'Space Grotesk';letter-spacing:20px;color:#F2EEE6;opacity:.92;text-shadow:0 2px 14px #000}
.num{position:absolute;right:90px;bottom:62px;width:104px;height:104px;border:5px solid #FFB000;border-radius:50%;text-align:center;line-height:112px;font:400 74px 'Bebas Neue';color:#FFB000;background:rgba(0,0,0,.45)}
.c::after{content:'';position:absolute;inset:auto 0 0 0;height:300px;z-index:1;background:linear-gradient(#0B0B1000,#0B0B10d0)}.c img.logo,.sub,.aut,.num{z-index:2}</style></head><body>
<div class="c" id="c1"><img class="bg" src="a_c1.png"><img class="logo" src="logo-destiempo-transparente.png"><div class="sub">EL SEGUNDO DE MÁS</div><div class="aut">ALEX BERR</div><div class="num">I</div></div>
<div class="c" id="c2"><img class="bg" src="a_c2.png"><img class="logo" src="logo-destiempo-transparente.png"><div class="sub" style="font-size:44px">LA HORA QUE NADIE MIRA</div><div class="aut">ALEX BERR</div><div class="num">II</div></div>
<div class="c" id="c3"><img class="bg" src="a_c3.png"><img class="logo" src="logo-destiempo-transparente.png"><div class="sub">A TIEMPO</div><div class="aut">ALEX BERR</div><div class="num">III</div></div>
</body></html>
