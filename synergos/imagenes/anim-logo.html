<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1080px;height:1080px;background:#F4F6F6;overflow:hidden;font-family:'DejaVu Sans',sans-serif}
canvas{position:absolute;left:0;top:0}
#logo{position:absolute;left:140px;top:430px;width:800px;opacity:0}
</style></head><body>
<canvas id="c" width="1080" height="1080"></canvas>
<img id="logo" src="logo-synergos.svg">
<script>
// Animación: las semillas aparecen una a una (modelo de Vogel, 137,5 grados) y luego el logo se funde encima.
const GA = 137.50776405 * Math.PI/180, N = 700;
const cx = 540, cy = 540, R = 430, c = R/Math.sqrt(N);
const INK='#1F1D1A', GREEN='#2C6D3F', LIGHT='#7CC090';
function mix(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));const A=p(a),B=p(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function color(n){return n<N*0.62?mix(INK,GREEN,Math.min(1,n/N*1.6)):mix(GREEN,LIGHT,(n/N-0.62)/0.38)}
const ctx=document.getElementById('c').getContext('2d');
// corte superior paralelo a la tilde (42,5 grados), como en las tarjetas
const a=(180-137.5)*Math.PI/180, D=[Math.cos(a),-Math.sin(a)], Nn=[-Math.sin(a),-Math.cos(a)], hh=R*0.64;
function dentro(x,y){return ((x-cx)*Nn[0]+(y-cy)*Nn[1]) <= hh}
const FPS=30, T_SEEDS=2.2, T_HOLD=0.0, T_LOGO=0.7, T_END=1.1;
const TOTAL=T_SEEDS+T_HOLD+T_LOGO+T_END;
window.renderFrame = function(t){
  ctx.clearRect(0,0,1080,1080);
  const k = Math.min(1, t/T_SEEDS);
  const shown = Math.floor(N * (1-Math.pow(1-k,2)));   // arranca rápido y frena al final
  for(let n=1;n<=shown;n++){
    const r=c*Math.sqrt(n), th=n*GA, x=cx+r*Math.cos(th), y=cy+r*Math.sin(th);
    if(!dentro(x,y)) continue;
    const age = (shown-n)/40, pop = Math.min(1, age+0.35);
    const rad=c*(0.40+0.10*Math.sqrt(n/N))*pop;
    ctx.fillStyle=color(n); ctx.globalAlpha = Math.max(0.42, 1-Math.max(0,(t-T_SEEDS*0.66))/T_LOGO*0.58);
    ctx.beginPath(); ctx.arc(x,y,rad,0,Math.PI*2); ctx.fill();
  }
  ctx.globalAlpha=1;
  const lt = Math.max(0, Math.min(1, (t-T_SEEDS*0.66)/T_LOGO));
  const lg=document.getElementById('logo'); lg.style.opacity = lt; lg.style.transform = `translateY(${(1-lt)*14}px)`;
};
window.TOTAL = TOTAL; window.FPS = FPS;
</script></body></html>
