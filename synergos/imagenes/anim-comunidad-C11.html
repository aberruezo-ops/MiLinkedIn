<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1080px;height:1080px;background:#2C6D3F;overflow:hidden;font-family:'DejaVu Serif',serif;color:#F4F6F6}
canvas{position:absolute;left:0;top:0}
#logo{position:absolute;left:140px;top:120px;width:800px;opacity:0}
.kicker{position:absolute;left:90px;top:430px;font-family:'DejaVu Sans',sans-serif;font-size:26px;letter-spacing:2px;color:#7CC090;text-transform:uppercase;opacity:0}
h1{position:absolute;left:90px;top:490px;width:900px;font-size:80px;line-height:1.1;margin:0;font-weight:normal;opacity:0}
h1 b{font-weight:normal;color:#7CC090}
.sub{position:absolute;left:90px;top:860px;width:900px;font-family:'DejaVu Sans',sans-serif;font-size:31px;line-height:1.4;color:#D7E8DC;opacity:0}
.firma{position:absolute;left:90px;bottom:60px;font-family:'DejaVu Sans',sans-serif;font-size:24px;color:#D7E8DC}
</style></head><body>
<canvas id="c" width="1080" height="1080"></canvas>
<img id="logo" src="logo-synergos-dark.svg">
<div class="kicker">Comunidad Synergós · pregunta abierta</div>
<h1>¿Quién te hizo crecer de verdad, <b>y qué hacía distinto</b>?</h1>
<div class="sub">Casi seguro que no era quien más hablaba en las reuniones. Cuéntalo en comentarios, sin nombres si no quieres.</div>
<div class="firma">Alejandro Berruezo</div>
<script>
const GA=137.50776405*Math.PI/180, N=700, cx=760, cy=820, R=420, c=R/Math.sqrt(N);
function mix(a,b,t){const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));const A=p(a),B=p(b);return '#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}
function color(n){return mix('#7CC090','#1F3D2A',Math.min(1,n/N))}
const a=(180-137.5)*Math.PI/180, Nn=[-Math.sin(a),-Math.cos(a)], hh=R*0.64;
const ctx=document.getElementById('c').getContext('2d');
window.TOTAL=8.5; window.FPS=30;
function ease(x){return x<0?0:x>1?1:1-Math.pow(1-x,3)}
window.renderFrame=function(t){
  ctx.clearRect(0,0,1080,1080);
  const k=Math.min(1,t/2.0), shown=Math.floor(N*(1-Math.pow(1-k,2)));
  const alpha = t<2.0 ? 0.55 : Math.max(0.16, 0.55-(t-2.0)/0.8*0.39);
  for(let n=1;n<=shown;n++){const r=c*Math.sqrt(n),th=n*GA,x=cx+r*Math.cos(th),y=cy+r*Math.sin(th);
    if(((x-cx)*Nn[0]+(y-cy)*Nn[1])>hh) continue;
    ctx.globalAlpha=alpha; ctx.fillStyle=color(n); ctx.beginPath(); ctx.arc(x,y,c*(0.40+0.10*Math.sqrt(n/N)),0,Math.PI*2); ctx.fill();}
  ctx.globalAlpha=1;
  document.getElementById('logo').style.opacity=ease((t-1.3)/0.7);
  document.querySelector('.kicker').style.opacity=ease((t-2.6)/0.5);
  const h=document.querySelector('h1'); const e=ease((t-2.9)/0.7); h.style.opacity=e; h.style.transform=`translateY(${(1-e)*16}px)`;
  const s=document.querySelector('.sub'); const e2=ease((t-3.8)/0.7); s.style.opacity=e2; s.style.transform=`translateY(${(1-e2)*16}px)`;
};
</script></body></html>
