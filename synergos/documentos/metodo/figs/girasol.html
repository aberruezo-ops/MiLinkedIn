<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:Fr;src:url('../../../imagenes/fonts/Fraunces.ttf')} html,body{margin:0;width:1200px;height:1000px;background:#F4F6F6}</style></head><body>
<canvas id="c" width="1200" height="1000"></canvas><script>
const g=document.getElementById('c').getContext('2d');const GA=137.50776405*Math.PI/180,N=900,cx=520,cy=520,R=430,c=R/Math.sqrt(N);
const mix=(A,B,t)=>{const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));const a=p(A),b=p(B);return '#'+a.map((v,i)=>Math.round(v+(b[i]-v)*t).toString(16).padStart(2,'0')).join('')};
for(let n=1;n<=N;n++){const r=c*Math.sqrt(n),th=n*GA;const t=n/N;g.fillStyle=t<.62?mix('#1F1D1A','#2C6D3F',Math.min(1,t*1.6)):mix('#2C6D3F','#7CC090',(t-.62)/.38);g.beginPath();g.arc(cx+r*Math.cos(th),cy+r*Math.sin(th),c*(0.42+0.12*Math.sqrt(t)),0,7);g.fill();}
// ángulo
g.strokeStyle='#943879';g.lineWidth=5;g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+300,cy);g.stroke();g.beginPath();g.moveTo(cx,cy);g.lineTo(cx+300*Math.cos(-GA),cy+300*Math.sin(-GA));g.stroke();
g.beginPath();g.arc(cx,cy,90,-GA,0);g.stroke();
g.fillStyle='rgba(244,246,246,0.92)';g.fillRect(cx+150,cy-230,250,96);g.fillStyle='#943879';g.font="64px Fr";g.fillText('137,5°',cx+165,cy-160);
g.font="28px 'DejaVu Sans'";g.fillStyle='#56606A';g.fillText('Cada semilla nueva, girada 137,5° respecto a la anterior.',60,980);
</script></body></html>
