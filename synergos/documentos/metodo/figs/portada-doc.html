<!doctype html><html><head><meta charset="utf-8"><style>@font-face{font-family:Fr;src:url('../../../imagenes/fonts/Fraunces.ttf')}
*{margin:0;padding:0;box-sizing:border-box}html,body{width:1240px;height:1754px;background:#1F1D1A;color:#F4F6F6;font-family:'DejaVu Sans',sans-serif;overflow:hidden}
#s{position:absolute;left:-640px;top:620px}
.logo{position:absolute;left:96px;top:110px;height:84px}
h1{position:absolute;left:96px;top:300px;font-family:Fr,serif;font-weight:normal;font-size:150px;line-height:1;letter-spacing:-2px}
h2{position:absolute;left:96px;top:470px;font-family:Fr,serif;font-weight:normal;font-size:64px;color:#7CC090}
.sub{position:absolute;left:96px;top:570px;width:700px;font-size:26px;line-height:1.45;color:#C9D2CD}
.meta{position:absolute;right:96px;bottom:110px;text-align:right;font-size:22px;line-height:1.6;color:#C9D2CD}
.meta b{display:block;font-family:Fr,serif;font-weight:normal;font-size:34px;color:#F4F6F6}
.meta i{font-style:normal;color:#7CC090;font-size:18px;letter-spacing:3px;text-transform:uppercase}
.bar{position:absolute;left:0;top:0;width:100%;height:18px;background:#2C6D3F}
</style></head><body><div class="bar"></div><canvas id="s" width="1300" height="1300"></canvas>
<img class="logo" src="../../../imagenes/logo-synergos-dark.svg">
<h1>El método</h1><h2>Crecer a la vez.</h2>
<div class="sub">Personas, conocimiento y tecnología avanzando en el mismo orden</div>
<div class="meta"><i>Documento de trabajo · uso interno</i><b>Alejandro Berruezo</b>Versión 1.5 · noviembre de 2026</div>
<script>const g=document.getElementById('s').getContext('2d'),GA=137.50776405*Math.PI/180,N=1800,cx=650,cy=650,R=620,c=R/Math.sqrt(N);
const mix=(A,B,t)=>{const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));const a=p(A),b=p(B);return '#'+a.map((v,i)=>Math.round(v+(b[i]-v)*t).toString(16).padStart(2,'0')).join('')};
for(let n=1;n<=N;n++){const r=c*Math.sqrt(n),th=n*GA,t=n/N;g.globalAlpha=0.25+0.6*t;g.fillStyle=t<.5?mix('#3A3733','#2C6D3F',t*2):mix('#2C6D3F','#7CC090',(t-.5)/.5);g.beginPath();g.arc(cx+r*Math.cos(th),cy+r*Math.sin(th),c*(0.4+0.14*Math.sqrt(t)),0,7);g.fill();}</script></body></html>
