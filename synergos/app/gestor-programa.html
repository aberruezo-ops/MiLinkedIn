const h=v=>String(v==null?'':v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num=v=>(v===''||v==null||isNaN(+v))?null:+v;
const byId=(c,id)=>S[c].find(x=>x.id===id);
const nameOf=(c,id)=>{const x=byId(c,id);return x?(x.nombre||x.saber||'(sin nombre)'):'—'};
const umbral=()=>num(S.aj.umbral)||3;

/* ---------- cálculos del método ---------- */
function delta(i){const b=num(i.base),o=num(i.objetivo),a=num(i.actual);if(b==null||o==null||a==null||o===b)return null;return Math.max(0,Math.min(1,(a-b)/(o-b)))}
function enVar(i){const v=num(i.variacion),b=num(i.base),a=num(i.actual);return v!=null&&b!=null&&a!=null&&Math.abs(a-b)<=v}
function guardaOk(i){const s=num(i.suelo),a=num(i.actual);if(s==null||a==null)return null;return i.sentido==='baja'?a<=s:a>=s}
function deltaGrupo(id,obj){let sw=0,sd=0;S.indicadores.filter(i=>i.ambitoId===id&&i.tipo==='avance'&&((i.elemento==='objetivo')===obj)).forEach(i=>{let d=delta(i);if(d==null)return;if(enVar(i))d=0;const w=num(i.peso)||1;sw+=w;sd+=d*w});return sw?sd/sw:null}
const deltaAmbito=id=>deltaGrupo(id,false),deltaObj=id=>deltaGrupo(id,true);
function regla(a){const bajos=MAD.filter(([k])=>(num(a[k])||1)<2).map(([,n])=>n);return{ok:!bajos.length,bajos}}
function faltan(ag){const L=num(ag.nivel)||1;return CONTROLES.filter(c=>c[1]<=L&&!(ag.controles||{})[c[0]])}
function techoAg(ag){let t=num(ag.techo)||4;if(ag.derechos)t=Math.min(t,2);return t}
function alertas(){
  const A=[];const hoy=new Date().toISOString().slice(0,10);
  S.ambitos.forEach(a=>{
    if((num(a.fase)||1)>=2&&!(a.restriccion||'').trim())A.push(['a','Falta nombrar la restricción de «'+a.nombre+'»','Sin restricción nombrada no se entra en diseño.','ambitos']);
    if(!(a.objetivo||'').trim())A.push(['m','Falta escribir el objetivo de negocio de «'+a.nombre+'»','Es el resultado que se quiere cambiar. La restricción se nombra respecto a él.','ambitos']);
    if((num(a.fase)||1)>=2&&!S.indicadores.some(i=>i.ambitoId===a.id&&i.elemento==='objetivo'))A.push(['a','«'+a.nombre+'» no tiene indicador del objetivo de negocio','Sin él no se sabe si el programa sirve al negocio. Un indicador de resultado por ámbito, con su línea base.','indicadores']);
    {const dp=deltaAmbito(a.id),dob=deltaObj(a.id);if(dp!=null&&dob!=null&&dp>=0.5&&dob<0.2)A.push(['m','Las palancas avanzan y el resultado no se mueve en «'+a.nombre+'»','Delta de las palancas '+Math.round(dp*100)+' %, del objetivo '+Math.round(dob*100)+' %. El programa puede estar ordenado y no servir al negocio.','indicadores']);if(dp!=null&&dob!=null&&dob>=0.5&&dp<0.2)A.push(['m','El resultado mejora y una palanca cae en «'+a.nombre+'»','Delta del objetivo '+Math.round(dob*100)+' %, de las palancas '+Math.round(dp*100)+' %. Lo ganado se queda sin quien lo sostenga.','indicadores'])}
    conflictos(a).forEach(c=>A.push(['a','Combinación de roles que no se admite en «'+a.nombre+'»',c,'roles']));
    if((num(a.fase)||1)>=2){const f=[['medicion','responsable de medición'],['contrafirma','persona que contrafirma']].filter(([k])=>!(a[k]||'').trim()).map(x=>x[1]);if(f.length)A.push(['m','Faltan roles con nombre en «'+a.nombre+'»','Sin '+f.join(' ni ')+' no se puede pasar una puerta con las firmas que pide el método.','roles'])}
    if((num(a.fase)||1)>=4&&!(a.adopcion||'').trim())A.push(['m','«'+a.nombre+'» está en escala sin responsable de adopción','Una persona con nombre y con tiempo, distinta de quien despliega la herramienta.','roles']);
    const r=regla(a);const tec=S.iniciativas.some(i=>i.ambitoId===a.id&&['acelera','automatiza','aumenta'].includes(i.verbo)&&i.estado==='curso'&&(num(i.fase)||1)>=3);
    if(!r.ok&&tec)A.push(['a','Regla de entrada sin cumplir en «'+a.nombre+'»','Hay tecnología en piloto y estos elementos están por debajo del nivel 2: '+r.bajos.join(', ')+'.','ambitos']);
    const crit=S.mapa.filter(m=>m.ambitoId===a.id&&m.critico&&(num(m.personas)||0)<=1).length;
    if(crit>=umbral())A.push(['a','Conocimiento concentrado en «'+a.nombre+'»',crit+' filas críticas dependen de una sola persona (umbral: '+umbral()+').','mapa']);
  });
  S.iniciativas.forEach(i=>{if(i.estado!=='retirada'&&i.ataca==='si'&&(num(i.fase)||1)>=2&&!((i.duenoBeneficio||'').trim()&&num(i.valorMax)!=null))A.push(['m','«'+i.nombre+'»: falta el valor y su dueño','Cuánto vale resolver la restricción (horquilla) y quién es el dueño del beneficio, en el negocio.','ambitos'])});
  S.indicadores.forEach(i=>{if(i.tipo==='guarda'&&guardaOk(i)===false)A.push(['a','Indicador de guarda bajo su suelo: '+i.nombre,'Ninguno puede bajar de su suelo para pasar una puerta.','indicadores'])});
  S.puertas.forEach(p=>{
    const n=nameOf('iniciativas',p.iniciativaId);
    if(!p.criteriosFecha||(p.fecha&&p.criteriosFecha>p.fecha))A.push(['a','Criterios no firmados antes: puerta de «'+n+'»','Un criterio escrito después del dato se parece a un voto secreto.','puertas']);
    if(p.salida==='pasar'&&(!(p.firma||'').trim()||!(p.contrafirma||'').trim()))A.push(['m','Puerta «'+n+'» sin firma y contrafirma','La firma la pone el patrocinador y contrafirma una persona ajena al equipo.','puertas']);
    if(p.salida==='pasar'&&!p.mide)A.push(['m','Puerta «'+n+'» sin datos certificados por Medición','','puertas']);
  });
  S.agentes.forEach(g=>{
    const L=num(g.nivel)||1,t=techoAg(g);
    if(L>t)A.push(['a','«'+g.nombre+'» opera por encima de su techo','Nivel '+L+' con techo '+t+(g.derechos?' (decide sobre derechos: techo 2)':'')+'.','agentes']);
    const f=faltan(g);if(f.length)A.push(['m','«'+g.nombre+'»: '+(f.length===1?'falta 1 control':'faltan '+f.length+' controles')+' para operar en el nivel '+L,f.slice(0,2).map(x=>x[2]).join('; ')+(f.length>2?'…':''),'agentes']);
    if(g.proxRevision&&g.proxRevision<hoy)A.push(['m','Revisión vencida: '+g.nombre,'Fijada para el '+fmtD(g.proxRevision)+'.','agentes']);
    if(!(g.dueno||'').trim())A.push(['a','Agente sin dueño: '+g.nombre,'Una persona con nombre responde de lo que hace.','agentes']);
  });
  return A.sort((x,y)=>x[0]<y[0]?-1:1);
}

/* ---------- vistas ---------- */
function pill(t,c){return '<span class="chip '+(c||'')+'">'+h(t)+'</span>'}
const salidaChip=s=>s==='pasar'?pill('Pasar','g'):s==='retirar'?pill('Retirar','t'):pill('Ajustar y repetir','a');
function vEmpty(t,s,btn){return '<div class="empty"><b>'+t+'</b>'+s+(btn?'<div style="margin-top:14px">'+btn+'</div>':'')+'</div>'}
function head(t,s,btn){return '<div class="row sp"><div><h2>'+t+'</h2><p class="lead">'+s+'</p></div>'+(btn||'')+'</div>'}
function addBtn(c,label){return '<button class="pri" data-a="new" data-c="'+c+'">'+label+'</button>'}
function rowBtns(c,id){return '<div class="acts"><button class="ghost" data-a="edit" data-c="'+c+'" data-id="'+id+'">Editar</button><button class="ghost danger" data-a="del" data-c="'+c+'" data-id="'+id+'">Borrar</button></div>'}
const pl=(n,a,b)=>n+' '+(n===1?a:b);
const fmtD=d=>d?new Date(d+'T00:00:00').toLocaleDateString('es-ES',{day:'numeric',month:'short',year:'numeric'}):'sin fecha';
const PNOM={diagnostico:'Diagnóstico',diseno:'Diseño',piloto:'Piloto',escala:'Escala',sostenimiento:'Sostenimiento',autonomia:'Autonomía'};

function vResumen(){
  if(!S.ambitos.length)return head('Resumen','Un programa se lleva por ámbitos: el servicio o el flujo que se va a transformar.')+vEmpty('Todavía no hay ningún ámbito','Empieza por nombrar el ámbito y su restricción. Todo lo demás cuelga de ahí.',addBtn('ambitos','Crear el primer ámbito'));
  const A=alertas(),altas=A.filter(x=>x[0]==='a').length;
  const pasadas=S.puertas.filter(p=>p.salida==='pasar').length;
  const enCurso=S.iniciativas.filter(i=>i.estado==='curso').length;
  let o=head('Resumen','El estado de cada ámbito y lo que el método marca como pendiente.');
  o+='<div class="kpis"><div class="kpi"><b>'+S.ambitos.length+'</b><span>Ámbitos</span></div><div class="kpi"><b>'+enCurso+'</b><span>Iniciativas en curso</span></div><div class="kpi"><b>'+pasadas+'<small style="font-size:18px;color:var(--muted)"> / '+S.puertas.length+'</small></b><span>Puertas pasadas</span></div><div class="kpi '+(altas?'warn':'good')+'"><b>'+A.length+'</b><span>'+(altas?altas+' urgentes':'Pendientes')+'</span></div></div>';
  o+='<p class="sech">Pendiente según el método</p>';
  const SEC={ambitos:'Ámbitos',mapa:'Mapa',roles:'Roles',indicadores:'Indicadores',puertas:'Puertas',agentes:'Agentes'};
  o+=A.length?'<div class="alist">'+A.slice(0,8).map(a=>'<a class="arow" href="#'+a[3]+'"><span class="sev '+(a[0]==='a'?'':'m')+'"></span><div><b>'+h(a[1])+'</b>'+(a[2]?'<small>'+h(a[2])+'</small>':'')+'</div><span class="go">'+h(SEC[a[3]]||'')+'</span></a>').join('')+'</div>'+(A.length>8?'<p class="muted" style="margin-top:-14px">Y '+(A.length-8)+' más en sus secciones.</p>':''):'<div class="alist"><div class="arow"><span class="sev" style="background:var(--green)"></span><div><b>Nada pendiente según las reglas del método.</b></div><span></span></div></div>';
  o+='<p class="sech">Ámbitos</p><div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr))">'+S.ambitos.map((a,ix)=>{
    const f=num(a.fase)||1,d=deltaAmbito(a.id),dO=deltaObj(a.id),r=regla(a),ini=S.iniciativas.filter(i=>i.ambitoId===a.id),ag=S.agentes.filter(x=>x.ambitoId===a.id);
    const crit=S.mapa.filter(m=>m.ambitoId===a.id&&m.critico&&(num(m.personas)||0)<=1).length;
    return '<div class="card'+(ix%2?' b':'')+'"><div class="amb"><div><div class="k">'+h(a.patrocinador||'Sin patrocinador')+'</div><h3>'+h(a.nombre)+'</h3>'
    +'<p style="margin:0 0 6px"><span class="muted">Objetivo de negocio:</span> '+(a.objetivo?h(a.objetivo):'<b class="danger">sin escribir</b>')+'</p><p style="margin:0 0 6px"><span class="muted">Restricción:</span> '+(a.restriccion?h(a.restriccion):'<b class="danger">sin nombrar</b>')+'</p>'
    +'<div class="steps">'+FASES.map((n,i)=>'<span class="'+(i+1<f?'d':i+1===f?'n':'')+'">'+n+'</span>').join('')+'</div>'
    +'<div class="row" style="gap:6px;margin-top:10px">'+pill(pl(ini.length,'iniciativa','iniciativas'))+pill(pl(ag.length,'agente','agentes'))+(crit?pill(pl(crit,'fila en una persona','filas en una persona'),'t'):'')+'</div></div>'
    +'<div><div class="row sp"><span class="k">Objetivo de negocio</span><b>'+(dO==null?'sin datos':Math.round(dO*100)+' %')+'</b></div><div class="bar"><i style="width:'+Math.round((dO||0)*100)+'%"></i></div><div class="row sp" style="margin-top:10px"><span class="k">Palancas</span><b>'+(d==null?'sin datos':Math.round(d*100)+' %')+'</b></div><div class="bar"><i style="width:'+Math.round((d||0)*100)+'%"></i></div>'
    +'<div class="k" style="margin-top:14px">Madurez</div><div class="mad">'+MAD.map(([k,n])=>{const v=num(a[k])||1;return '<div class="'+(v>=2?'ok':'no')+'"><b>'+v+'</b>'+n.slice(0,6)+'.</div>'}).join('')+'</div>'
    +'<p class="muted" style="margin:10px 0 0;font-size:13px">'+(r.ok?'Regla de entrada cumplida: la tecnología puede entrar en el servicio.':'Regla de entrada: falta nivel 2 en '+h(r.bajos.join(', '))+'.')+'</p></div></div></div>'}).join('')+'</div>';
  return o;
}
function vAmbitos(){
  let o=head('Ámbitos e iniciativas','Cada iniciativa recorre las cinco fases dentro de su ámbito. Una restricción por ámbito.',addBtn('ambitos','Nuevo ámbito'));
  if(!S.ambitos.length)return o+vEmpty('Sin ámbitos','Crea el primero para colgar de él las iniciativas.');
  return o+S.ambitos.map(a=>{const ini=S.iniciativas.filter(i=>i.ambitoId===a.id);
    return '<div class="card" style="margin-bottom:16px"><div class="row sp"><div><div class="k">Fase '+(num(a.fase)||1)+' · '+FASES[(num(a.fase)||1)-1]+'</div><h3>'+h(a.nombre)+'</h3></div>'+rowBtns('ambitos',a.id)+'</div>'
    +'<dl><dt>Objetivo de negocio</dt><dd>'+h(a.objetivo||'—')+'</dd><dt>Restricción</dt><dd>'+h(a.restriccion||'—')+'</dd><dt>Patrocinador</dt><dd>'+h(a.patrocinador||'—')+'</dd><dt>Madurez</dt><dd>'+MAD.map(([k,n])=>n+' '+(num(a[k])||1)).join(' · ')+'</dd>'+(a.evidencia?'<dt>Evidencia</dt><dd>'+h(a.evidencia)+'</dd>':'')+'</dl>'
    +'<div class="row sp" style="margin-top:14px"><span class="k">Iniciativas · '+ini.length+'</span><button data-a="new" data-c="iniciativas" data-amb="'+a.id+'">Añadir iniciativa</button></div>'
    +(ini.length?'<div class="scroll"><table><tr><th>Iniciativa</th><th>Fase</th><th>Tecnología</th><th>Valor previsto</th><th>Estado</th><th></th></tr>'+ini.map(i=>'<tr><td><b>'+h(i.nombre)+'</b><br><span class="muted">'+h(i.alcance||'')+' · dueño: '+h(i.dueno||'sin dueño')+'</span></td><td>'+h(FASES[(num(i.fase)||1)-1])+'</td><td>'+h(i.verbo||'—')+(i.ataca==='no'?'<br>'+pill('No ataca la restricción','a'):'')+'</td><td>'+(num(i.valorMax)!=null?h((num(i.valorMin)!=null?(+i.valorMin).toLocaleString('es-ES')+' a ':'hasta ')+(+i.valorMax).toLocaleString('es-ES'))+' €'+(i.plazoValor?'<br><span class="muted">'+h(i.plazoValor)+'</span>':'')+'<br><span class="muted">dueño: '+h(i.duenoBeneficio||'sin dueño')+'</span>':'—')+'</td><td>'+pill(i.estado||'curso',i.estado==='retirada'?'t':'g')+'</td><td>'+rowBtns('iniciativas',i.id)+'</td></tr>').join('')+'</table></div>':'<p class="muted">Sin iniciativas todavía.</p>')+'</div>'}).join('');
}
function vPuertas(){
  let o=head('Puertas','Una decisión por puerta, con los criterios firmados antes de ver el dato. Tres salidas: pasar, ajustar y repetir, o retirar.',addBtn('puertas','Registrar decisión'));
  if(!S.puertas.length)return o+vEmpty('Sin decisiones registradas','Cada puerta queda escrita con su fecha, sus firmas y el motivo.');
  return o+[...S.puertas].sort((a,b)=>(b.fecha||'')<(a.fecha||'')?-1:1).map(p=>{const tarde=!p.criteriosFecha||(p.fecha&&p.criteriosFecha>p.fecha);
    return '<div class="card b" style="margin-bottom:14px"><div class="row sp"><div><div class="k">Puerta de '+h((PNOM[p.puerta]||p.puerta||'').toLowerCase())+' · '+h(fmtD(p.fecha))+'</div><h3>'+h(nameOf('iniciativas',p.iniciativaId))+'</h3></div><div class="row">'+salidaChip(p.salida)+rowBtns('puertas',p.id)+'</div></div>'
    +'<div class="row" style="gap:6px;margin-bottom:8px">'+(tarde?pill('Criterios no firmados antes','t'):pill('Criterios firmados antes','g'))+(p.mide?pill('Datos certificados','g'):pill('Sin certificar','a'))+'</div>'
    +'<dl><dt>Firma</dt><dd>'+h(p.firma||'—')+'</dd><dt>Contrafirma</dt><dd>'+h(p.contrafirma||'—')+'</dd>'+['q1','valorPuerta','q2','q3','q4','q5'].filter(q=>p[q]).map((q,i)=>'<dt>'+(q==='valorPuerta'?'Valor corregido':'Pregunta '+q.slice(1))+'</dt><dd>'+h(p[q])+'</dd>').join('')+(p.notas?'<dt>Notas</dt><dd>'+h(p.notas)+'</dd>':'')+'</dl></div>'}).join('');
}
function vMapa(){
  let o=head('Mapa de lo que nadie escribió','Qué se sabe, quién lo sabe, dónde se usa y cuán concentrado está. La última columna es la que asusta.',addBtn('mapa','Añadir fila'));
  if(!S.mapa.length)return o+vEmpty('El mapa está vacío','Se levanta en el diagnóstico, conversando con quien hace el trabajo.');
  return o+S.ambitos.map(a=>{const f=S.mapa.filter(m=>m.ambitoId===a.id);if(!f.length)return '';const crit=f.filter(m=>m.critico&&(num(m.personas)||0)<=1).length;
    return '<div class="card" style="margin-bottom:16px"><div class="row sp"><h3>'+h(a.nombre)+'</h3>'+(crit>=umbral()?pill(crit+' filas críticas en una persona','t'):pill(crit+' filas críticas en una persona','g'))+'</div><p class="muted" style="margin:0 0 8px">'+f.length+' filas. Umbral para parar a repartir el conocimiento: '+umbral()+'.</p><div class="scroll"><table><tr><th>Qué se sabe</th><th>Quién</th><th>Dónde</th><th>Personas</th><th>Con el diseño</th><th></th></tr>'
    +f.map(m=>'<tr><td>'+(m.critico?pill('Crítico','t')+' ':'')+h(m.saber)+'</td><td>'+h(m.quien||'')+'</td><td>'+h(m.donde||'')+'</td><td><b>'+h(m.personas==null?'':m.personas)+'</b></td><td>'+h({persona:'Se queda en la persona',sistema:'Pasa al sistema',pierde:'Se pierde'}[m.destino]||'Sin decidir')+'</td><td>'+rowBtns('mapa',m.id)+'</td></tr>').join('')+'</table></div></div>'}).join('');
}
function vInd(){
  let o=head('Indicadores','Uno del objetivo de negocio y al menos uno por elemento. De avance, con objetivo, entran en el delta; el del objetivo y el de las palancas se leen aparte y no se promedian. De guarda, con suelo, no entran en la media. La línea base se toma antes de cambiar nada.',addBtn('indicadores','Nuevo indicador'));
  if(!S.indicadores.length)return o+vEmpty('Sin indicadores','Un indicador del objetivo de negocio y al menos uno por elemento, con su línea base y su variación normal.');
  return o+S.ambitos.map(a=>{const f=S.indicadores.filter(i=>i.ambitoId===a.id);if(!f.length)return '';const d=deltaAmbito(a.id),dO=deltaObj(a.id);
    return '<div class="card b" style="margin-bottom:16px"><div class="row sp"><h3>'+h(a.nombre)+'</h3><span class="k">Delta del objetivo · '+(dO==null?'sin datos':Math.round(dO*100)+' %')+' · Delta de las palancas · '+(d==null?'sin datos':Math.round(d*100)+' %')+'</span></div><div class="scroll"><table><tr><th>Indicador</th><th>Línea base</th><th>Actual</th><th>Objetivo o suelo</th><th>Estado</th><th></th></tr>'
    +f.map(i=>{let est;if(i.tipo==='guarda'){const g=guardaOk(i);est=g==null?pill('Sin datos'):g?pill('Por encima del suelo','g'):pill('Bajo el suelo','t')}else{const dd=delta(i);est=dd==null?pill('Sin datos'):enVar(i)?pill('Dentro de la variación normal','a'):pill(Math.round(dd*100)+' % recorrido','g')}
    return '<tr><td><b>'+h(i.nombre)+'</b><br><span class="muted">'+h(i.elemento==='objetivo'?'objetivo de negocio':(i.elemento||''))+' · '+(i.tipo==='guarda'?'guarda':'avance')+'</span></td><td>'+h(i.base??'')+' '+h(i.unidad||'')+'</td><td>'+h(i.actual??'')+'</td><td>'+h(i.tipo==='guarda'?i.suelo??'':i.objetivo??'')+'</td><td>'+est+'</td><td>'+rowBtns('indicadores',i.id)+'</td></tr>'}).join('')+'</table></div></div>'}).join('');
}
function vAgentes(){
  let o=head('Agentes','La ficha de cada agente y los controles que tienen que existir para el nivel en que opera. Un límite solo cuenta si lo aplica el sistema.',addBtn('agentes','Nueva ficha'));
  if(!S.agentes.length)return o+vEmpty('Sin agentes en el inventario','Cada agente tiene ficha antes de entrar en un piloto. Un agente que se usa y no está aquí es una señal de que algo va mal.');

  if(a==='saveaj'){try{await ajDoc.set({nombre:$('#aj-nombre').value,umbral:+$('#aj-umbral').value||3});alert2('Ajustes guardados')}catch(err){alert2('No se pudo guardar')}return}
  if(a==='export'){const dl=await claude.use('downloads');const data=JSON.stringify({programa:S.aj,ambitos:S.ambitos,iniciativas:S.iniciativas,indicadores:S.indicadores,puertas:S.puertas,mapa:S.mapa,agentes:S.agentes},null,1);if(!dl){alert2('Este visor no permite descargar archivos');return}try{await dl.save({filename:'programa-synergos.json',data})}catch(err){}return}
  if(a==='clearej'){const k=t.dataset.k||'x';if(armed!=='ej'){armed='ej';t.textContent='Confirmar: quitar el ejemplo';setTimeout(()=>{armed=null},4000);return}armed=null;const jobs=[];['ambitos','iniciativas','indicadores','puertas','mapa','agentes','camino'].forEach(c=>S[c].filter(x=>x.ejemplo).forEach(x=>jobs.push(db.collection(c).doc(x.id).delete())));try{await Promise.all(jobs)}catch(err){alert2('No se pudo quitar todo el ejemplo')}return}
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='camp-sel'){campAmb=t.value;campFase=null;render();return}
  if(t.dataset&&t.dataset.a==='cam'){const cur=S.camino.find(x=>x.id===campAmb);const {id:_i,...rest}=cur||{};const items={...((cur&&cur.items)||{}),[t.dataset.k]:t.checked};try{await db.collection('camino').doc(campAmb).set({...rest,items})}catch(err){alert2('No se pudo guardar');t.checked=!t.checked}return}if(t.dataset&&t.dataset.a==='ctrl'){const g=byId('agentes',t.dataset.id);if(!g)return;const c={...(g.controles||{}),[t.dataset.k]:t.checked};const {id,...rest}=g;try{await db.collection('agentes').doc(g.id).set({...rest,controles:c})}catch(err){alert2('No se pudo guardar'); t.checked=!t.checked}}
});
document.addEventListener('submit',e=>{if(e.target.id==='frm')saveForm(e)});
window.addEventListener('hashchange',()=>{tab=(location.hash||'#resumen').slice(1);render();window.scrollTo(0,0)});

/* ---------- datos ---------- */
function snap(c){return db.collection(c).onSnapshot(s=>{S[c]=s.docs.map(d=>({id:d.id,...d.data()}));ready[c]=1;render()},()=>{ready[c]=1;render()})}
(async function start(){
  render();
  try{db=await claude.use('db')}catch(e){db=null}
  if(!db){$('#main').innerHTML=vEmpty('Hace falta iniciar sesión','Este programa guarda sus datos en tu cuenta. Ábrelo con tu sesión de Claude para verlo y editarlo.');return}
  ajDoc=db.doc('ajustes/programa');
  ajDoc.onSnapshot(s=>{S.aj=s.exists?s.data():{};render()},()=>{});
  ['ambitos','iniciativas','indicadores','puertas','mapa','agentes','camino'].forEach(snap);
  setTimeout(()=>{if(Object.keys(ready).length<7)render()},10000);
})();
})();
</script>
