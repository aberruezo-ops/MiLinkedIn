@page{size:17.4302in 11.2500in;margin:0}

body{margin:0} svg{width:17.4302in;height:11.2500in;display:block}</style></head><body><svg viewBox="0 0 1743 1125" xmlns="http://www.w3.org/2000/svg"><image href="arte/contraportada-acuarela.jpg" x="0" y="0" width="862" height="1125" preserveAspectRatio="xMidYMid slice"/><image href="arte/portada-acuarela.jpg" x="880" y="0" width="863" height="1125" preserveAspectRatio="xMidYMid slice"/><rect x="862" y="0" width="18" height="1125" fill="#e9c46a"/><text x="1305" y="120" font-family="Fraunces" font-weight="700" font-size="30" fill="#3a2a1e" stroke="#fffaf0" stroke-width="10" stroke-opacity=".85" paint-order="stroke" stroke-linejoin="round" text-anchor="middle" letter-spacing="9">VOLUMEN II</text><text x="1305" y="222" font-family="Fraunces" font-weight="700" font-size="96" fill="#3a2a1e" stroke="#fffaf0" stroke-width="10" stroke-opacity=".85" paint-order="stroke" stroke-linejoin="round" text-anchor="middle">Lúa y el</text><text x="1305" y="318" font-family="Fraunces" font-weight="700" font-size="88" fill="#b5562b" stroke="#fffaf0" stroke-width="10" stroke-opacity=".85" paint-order="stroke" stroke-linejoin="round" text-anchor="middle">jardín de todos</text><rect x="1020" y="342" width="570" height="48" rx="24" fill="#fffaf0" fill-opacity=".9"/><text x="1305" y="374" font-family="Fraunces" font-weight="600" font-size="23" text-anchor="middle" fill="#3a2a1e">Para colorear · 4 a 8 años · Con guía para familias</text><rect x="1135" y="1052" width="340" height="56" rx="28" fill="#fffaf0" fill-opacity=".88"/><text x="1305" y="1090" font-family="Fraunces" font-weight="700" font-size="32" text-anchor="middle" fill="#3a2a1e">Alex Berruezo</text><rect x="87" y="55" width="700" height="300" rx="26" fill="#fffaf0" fill-opacity=".92"/><text x="437" y="100" font-family="Fraunces" font-weight="700" font-size="27" text-anchor="middle" fill="#3a2a1e">Volumen II de la serie Lúa</text><text x="437" y="145" font-family="Fraunces" font-weight="600" font-size="24" text-anchor="middle" fill="#3a2a1e">Un solar abandonado, cuatro amigos muy distintos</text><text x="437" y="182" font-family="Fraunces" font-weight="600" font-size="24" text-anchor="middle" fill="#3a2a1e">y un montón de semillas. Lúa, Hera, Raspi y Neu</text><text x="437" y="219" font-family="Fraunces" font-weight="600" font-size="24" text-anchor="middle" fill="#3a2a1e">descubren que cada uno crece a su tiempo, que en</text><text x="437" y="256" font-family="Fraunces" font-weight="600" font-size="24" text-anchor="middle" fill="#3a2a1e">el jardín cabe todo el mundo y que cuidar</text><text x="437" y="293" font-family="Fraunces" font-weight="600" font-size="24" text-anchor="middle" fill="#3a2a1e">el planeta empieza en un solar.</text><text x="437" y="330" font-family="Fraunces" font-weight="700" font-size="24" text-anchor="middle" fill="#3a2a1e">Con guía para familias.</text><rect x="638" y="968" width="200" height="120" fill="#fff"/></svg></body></html>
